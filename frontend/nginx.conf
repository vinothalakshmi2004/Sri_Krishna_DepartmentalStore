# nginx inside the frontend container:
#   - serves the built React site
#   - sends /api, /uploads and /socket.io to the backend container
#   - sends every other path (/order, /admin/...) to index.html (React routes)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gallery upload = up to 12 images x 5 MB in one request
  client_max_body_size 64m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # REST API
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Uploaded product / logo / gallery images
  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
  }

  # Live admin alerts (Socket.io over WebSocket)
  location /socket.io/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  # Barcode scanner engine
  location ~* \.wasm$ {
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Built files carry a hash in their name -> cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # React routes; index.html is never cached so a new deploy shows at once
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
